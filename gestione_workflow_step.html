<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Passo Workflow</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form { max-width: 600px; display: grid; grid-template-columns: 150px 1fr; gap: 10px; }
        label { text-align: right; padding-right: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .full-width { grid-column: 1 / -1; }
        #parametri-container > div { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee; display: contents; }
        button { grid-column: 2 / 3; width: auto; padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Crea / Modifica Passo Workflow</h1>

    <form id="form-workflow-step">
        <!-- Questi campi sono nascosti, dovrebbero essere popolati dal contesto (es. ID del workflow a cui si sta aggiungendo il passo) -->
        <input type="hidden" id="workflow_id" name="workflow_id" value="1"> <!-- Esempio: stiamo lavorando sul workflow 1 -->
        <input type="hidden" id="step_id" name="step_id" value=""> <!-- Vuoto per creazione, popolato per modifica -->

        <label for="nome_passo">Nome Passo:</label>
        <input type="text" id="nome_passo" name="nome_passo" required>

        <label for="descrizione_passo">Descrizione:</label>
        <textarea id="descrizione_passo" name="descrizione_passo"></textarea>
        
        <label for="ordine">Ordine:</label>
        <input type="number" id="ordine" name="ordine" value="1" required>
        
        <label for="sottopasso">Sottopasso:</label>
        <input type="number" id="sottopasso" name="sottopasso" value="1" required>

        <label for="ruolo_responsabile_id">ID Ruolo Resp.:</label>
        <input type="number" id="ruolo_responsabile_id" name="ruolo_responsabile_id" value="1" required>

        <hr class="full-width">

        <label for="azione-select">Azione da Eseguire:</label>
        <select id="azione-select" required>
            <option value="" disabled selected>-- Seleziona un'azione --</option>
        </select>

        <!-- Questo contenitore verrà popolato dinamicamente con i campi dei parametri -->
        <div id="parametri-container" class="full-width"></div>
        
        <hr class="full-width">
        
        <button type="submit">Salva Passo</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const azioneSelect = document.getElementById('azione-select');
            const parametriContainer = document.getElementById('parametri-container');
            const form = document.getElementById('form-workflow-step');

            let azioniDisponibili = [];

            // 1. Carica le azioni disponibili dall'API
            fetch('https://95.110.227.54/LpWF/api/azioni/leggi.php')
                .then(response => response.json())
                .then(data => {
                    azioniDisponibili = data;
                    azioniDisponibili.forEach(azione => {
                        const option = document.createElement('option');
                        option.value = azione.id;
                        option.textContent = azione.nome_azione;
                        // Salviamo i parametri richiesti direttamente sull'elemento option per un facile accesso
                        option.dataset.params = azione.parametri_richiesti;
                        azioneSelect.appendChild(option);
                    });
                })
                .catch(error => console.error("Errore nel caricamento delle azioni:", error));

            // 2. Ascolta i cambiamenti sulla combobox delle azioni
            azioneSelect.addEventListener('change', (event) => {
                parametriContainer.innerHTML = ''; // Pulisci i parametri vecchi
                
                const selectedOption = event.target.options[event.target.selectedIndex];
                const parametriRichiesti = JSON.parse(selectedOption.dataset.params || '[]');

                if (parametriRichiesti.length > 0) {
                     const title = document.createElement('h4');
                     title.textContent = "Parametri Azione";
                     title.style.gridColumn = "1 / -1"; // Span full width
                     parametriContainer.appendChild(title);
                }

                // Crea dinamicamente i campi di input per i parametri richiesti
                parametriRichiesti.forEach(param => {
                    const label = document.createElement('label');
                    label.htmlFor = `param_${param}`;
                    label.textContent = `${param.replace(/_/g, ' ')}:`; // Rende il nome più leggibile

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `param_${param}`;
                    input.name = param; // Il nome è la chiave che useremo nel JSON finale
                    input.required = true;

                    parametriContainer.appendChild(label);
                    parametriContainer.appendChild(input);
                });
            });
            
            // 3. Gestisci l'invio del form
            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const formData = new FormData(form);
                const payload = {
                    workflow_id: parseInt(formData.get('workflow_id')),
                    nome_passo: formData.get('nome_passo'),
                    descrizione_passo: formData.get('descrizione_passo'),
                    ordine: parseInt(formData.get('ordine')),
                    sottopasso: parseInt(formData.get('sottopasso')),
                    ruolo_responsabile_id: parseInt(formData.get('ruolo_responsabile_id')),
                    azione_id: parseInt(azioneSelect.value)
                };

                // Raccogli i parametri dinamici
                const parametri_azione = {};
                const parametriInputs = parametriContainer.querySelectorAll('input');
                parametriInputs.forEach(input => {
                    parametri_azione[input.name] = input.value;
                });
                payload.parametri_azione = parametri_azione;
                
                console.log("Dati inviati:", JSON.stringify(payload, null, 2));
                
                // Invia i dati all'API che abbiamo già creato
                fetch('https://95.110.227.54/LpWF/api/workflow_step/controlla_ordine.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(result => {
                    alert('Risposta dal server: ' + result.message);
                    console.log(result);
                })
                .catch(error => console.error("Errore nel salvataggio del passo:", error));
            });
        });
    </script>

</body>
</html>
