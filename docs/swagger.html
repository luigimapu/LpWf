<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swagger UI – LpWF</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
      body { margin: 0; }
      .topbar { display:none; }
      #swagger-ui { max-width: 1200px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <header style="padding:10px 16px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
      <strong>Swagger UI – LpWF</strong>
      <span style="flex:1 1 auto"></span>
      <a href="index.html">Docs Index</a>
      <a href="api.html">Redoc</a>
      <a href="postman_collection.json" download>Postman Collection</a>
      <a id="openPostmanCollection" href="#">Apri in Postman</a>
      <a id="openPostmanCollectionWeb" href="#">Import Web</a>
      <a href="postman_environment.json" download>Env Local</a>
      <a id="openPostmanEnvLocal" href="#">Apri Env Local</a>
      <a id="openPostmanEnvLocalWeb" href="#">Import Env Local</a>
      <a href="postman_environment.staging.json" download>Env Staging</a>
      <a id="openPostmanEnvStaging" href="#">Apri Env Staging</a>
      <a id="openPostmanEnvStagingWeb" href="#">Import Env Staging</a>
      <a href="postman_environment.prod.json" download>Env Production</a>
      <a id="openPostmanEnvProd" href="#">Apri Env Production</a>
      <a id="openPostmanEnvProdWeb" href="#">Import Env Production</a>
    </header>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: 'openapi.yaml',
        dom_id: '#swagger-ui',
        docExpansion: 'list',
        defaultModelsExpandDepth: 0,
        presets: [SwaggerUIBundle.presets.apis],
      });
      // Configura deep link per import Postman con URL assoluto
      (function(){
        function absUrl(file) {
          var base = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
          return base + file;
        }
        var colUrl = encodeURIComponent(absUrl('postman_collection.json'));
        var deep = 'postman://app/import?url=' + colUrl;
        var web = 'https://www.postman.com/import?url=' + colUrl;
        var a1 = document.getElementById('openPostmanCollection');
        var a2 = document.getElementById('openPostmanCollectionWeb');
        if (a1) a1.href = deep;
        if (a2) a2.href = web;

        // Env deep links
        function setEnvLink(id, file) {
          var el = document.getElementById(id);
          if (!el) return;
          var url = encodeURIComponent(absUrl(file));
          el.href = 'postman://app/import?url=' + url;
        }
        function setEnvWebLink(id, file) {
          var el = document.getElementById(id);
          if (!el) return;
          var url = encodeURIComponent(absUrl(file));
          el.href = 'https://www.postman.com/import?url=' + url;
        }
        setEnvLink('openPostmanEnvLocal', 'postman_environment.json');
        setEnvLink('openPostmanEnvStaging', 'postman_environment.staging.json');
        setEnvLink('openPostmanEnvProd', 'postman_environment.prod.json');
        setEnvWebLink('openPostmanEnvLocalWeb', 'postman_environment.json');
        setEnvWebLink('openPostmanEnvStagingWeb', 'postman_environment.staging.json');
        setEnvWebLink('openPostmanEnvProdWeb', 'postman_environment.prod.json');
      })();
    </script>
  </body>
  </html>
