openapi: 3.0.3
info:
  title: LpWF Gestionale API
  version: 1.1.0
  description: |
    API REST del gestionale LpWF e servizi correlati.

    Autenticazione con JWT Bearer sul prefisso `/api`. Endpoint pubblici senza auth: `/api/health`, `/api/tenant_health` e lo script esterno `hub_catalogo` (read‑only).
  contact:
    name: LpWF Team
servers:
  - url: https://www.lprent.it/LpWF_refactor/api
    description: Produzione
  - url: https://www.lprent.it/LpWf_staging/api
    description: Staging
  - url: /api
    description: Locale (stesso host)
tags:
  - name: Auth
  - name: System
  - name: Tickets
  - name: Tasks
  - name: Workflows
  - name: Users
  - name: Groups
  - name: Clients
  - name: Audit
  - name: Services
  - name: Catalog
  - name: Media
  - name: Enrichment
  - name: Hub
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            example:
              email: utente@example.com
              password: pwd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Info utente corrente
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (stateless)
      responses:
        '200': { description: OK }
  /auth/password:
    post:
      tags: [Auth]
      summary: Cambio password utente corrente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string }
                new_password: { type: string }
              required: [current_password, new_password]
            example:
              current_password: oldpwd
              new_password: NewPwd!2025
      responses:
        '200': { description: OK }
  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Reset password (solo ADMIN/SUPERVISOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
                new_password: { type: string }
              required: [user_id, new_password]
            example:
              user_id: 12
              new_password: Temp2025!
      responses:
        '200': { description: OK }

  /health:
    get:
      tags: [System]
      summary: Stato API/DB (pubblico)
      security: []
      responses:
        '200': { description: OK }
  /tenant_health:
    get:
      tags: [System]
      summary: Stato DB tenant (pubblico)
      security: []
      responses:
        '200': { description: OK }
  /config:
    get:
      tags: [System]
      summary: Config pubblica runtime
      responses:
        '200': { description: OK }

  /tickets:
    get:
      tags: [Tickets]
      summary: Lista ticket
      parameters:
        - { $ref: '#/components/parameters/pStato' }
        - { $ref: '#/components/parameters/pPriorita' }
        - { $ref: '#/components/parameters/pAssegnatoA' }
        - { $ref: '#/components/parameters/pCreatoDa' }
        - { $ref: '#/components/parameters/pClienteId' }
        - { $ref: '#/components/parameters/pSearch' }
        - { $ref: '#/components/parameters/pMine' }
        - { $ref: '#/components/parameters/pTeam' }
        - { $ref: '#/components/parameters/pChiusoDal' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ticket' }
    post:
      tags: [Tickets]
      summary: Crea ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreateRequest' }
            example:
              titolo: Problema rete
              priorita: MEDIA
              descrizione: Il wifi non funziona da stamattina
      responses:
        '201': { description: Creato }
  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Dettaglio ticket
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
    put:
      tags: [Tickets]
      summary: Aggiorna ticket
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdateRequest' }
      responses:
        '200': { description: OK }
  /tickets/{id}/assign:
    put:
      tags: [Tickets]
      summary: Assegna ticket
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer, format: int64 }
      responses:
        '200': { description: OK }
  /tickets/{id}/close:
    put:
      tags: [Tickets]
      summary: Chiudi ticket
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /tickets/{id}/reopen:
    put:
      tags: [Tickets]
      summary: Riapri ticket
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /tickets/{id}/comment:
    get:
      tags: [Tickets]
      summary: Lista commenti
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TicketComment' }
    post:
      tags: [Tickets]
      summary: Aggiungi commento
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messaggio: { type: string }
              required: [messaggio]
            example:
              messaggio: Sto verificando con il reparto tecnico.
      responses:
        '201': { description: Creato }
  /tickets/{id}/comment_attach:
    post:
      tags: [Tickets]
      summary: Carica allegato per commento
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                comment_id: { type: integer, format: int64 }
                file:
                  type: string
                  format: binary
              required: [comment_id, file]
      responses:
        '201': { description: Creato }
  /tickets/{id}/attachments:
    get:
      tags: [Tickets]
      summary: Lista allegati ticket
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TicketAttachment' }

  /tasks:
    get:
      tags: [Tasks]
      summary: Lista task
      parameters:
        - name: workflow_istanza_id
          in: query
          schema: { type: integer }
        - name: workflow_modello_id
          in: query
          schema: { type: integer }
        - name: assegnato_a_utente_id
          in: query
          schema: { type: integer }
        - name: unassigned
          in: query
          schema: { type: boolean }
        - { $ref: '#/components/parameters/pSearch' }
      responses:
        '200': { description: OK }
  /tasks/{id}/assign:
    put:
      tags: [Tasks]
      summary: Assegna task
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
      responses:
        '200': { description: OK }
  /tasks/{id}/complete:
    put:
      tags: [Tasks]
      summary: Completa task
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /tasks/{id}/note:
    get:
      tags: [Tasks]
      summary: Note del task
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    post:
      tags: [Tasks]
      summary: Aggiungi nota
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id_utente: { type: integer }
                nota: { type: string }
              required: [id_utente, nota]
            example:
              id_utente: 5
              nota: Verificato con il cliente, in attesa feedback.
      responses:
        '201': { description: Creato }
  /tasks/{id}/note_attach:
    post:
      tags: [Tasks]
      summary: Carica allegato per nota task
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                note_id: { type: integer }
                file:
                  type: string
                  format: binary
              required: [note_id, file]
      responses:
        '201': { description: Creato }

  /workflows:
    get:
      tags: [Workflows]
      summary: Lista modelli
      responses:
        '200': { description: OK }
  /workflows/{id}:
    get:
      tags: [Workflows]
      summary: Dettaglio modello (con passi)
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /workflows/{id}/start:
    post:
      tags: [Workflows]
      summary: Avvia istanza workflow
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entita_collegata_tipo: { type: string }
                entita_collegata_id: { type: string }
                id_utente_avvio: { type: integer }
      responses:
        '201': { description: Creato }

  /workflowistanze:
    get:
      tags: [Workflows]
      summary: Lista istanze
      responses:
        '200': { description: OK }
  /workflowistanze/{id}:
    get:
      tags: [Workflows]
      summary: Dettaglio istanza
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }

  /utenti:
    get:
      tags: [Users]
      summary: Lista utenti
      parameters:
        - { $ref: '#/components/parameters/pSearch' }
        - name: ruolo
          in: query
          schema: { type: string, enum: [ADMIN, SUPERVISOR, USER] }
        - name: group_id
          in: query
          schema: { type: integer }
        - name: include_inactive
          in: query
          schema: { type: boolean }
        - name: with_groups
          in: query
          schema: { type: boolean }
        - name: with_supervisors
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: OK }
    post:
      tags: [Users]
      summary: Crea utente (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
            example:
              nome: Mario
              cognome: Rossi
              email: mario.rossi@example.com
              password: ChangeMe1!
              ruolo: USER
      responses:
        '201': { description: Creato }
  /utenti/{id}:
    get:
      tags: [Users]
      summary: Dettaglio utente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    put:
      tags: [Users]
      summary: Aggiorna utente (ruolo solo ADMIN)
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Users]
      summary: Disattiva/Elimina utente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /utenti/{id}/groups:
    get:
      tags: [Users]
      summary: Gruppi dell'utente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /utenti/{id}/supervised:
    get:
      tags: [Users]
      summary: Utenti sotto il supervisor
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /utenti/{id}/add_supervised/{userId}:
    post:
      tags: [Users]
      summary: Associa utente a supervisor
      parameters:
        - { $ref: '#/components/parameters/pId' }
        - { $ref: '#/components/parameters/pUserId' }
      responses:
        '201': { description: Creato }
  /utenti/{id}/remove_supervised/{userId}:
    delete:
      tags: [Users]
      summary: Rimuove utente dal supervisor
      parameters:
        - { $ref: '#/components/parameters/pId' }
        - { $ref: '#/components/parameters/pUserId' }
      responses:
        '200': { description: OK }
  /utenti/{id}/supervisors:
    get:
      tags: [Users]
      summary: Supervisori dell'utente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /utenti/{id}/set_supervisor/{supervisorId}:
    post:
      tags: [Users]
      summary: Imposta supervisor unico per l'utente
      parameters:
        - { $ref: '#/components/parameters/pId' }
        - name: supervisorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /gruppi:
    get:
      tags: [Groups]
      summary: Lista gruppi
      parameters:
        - name: with_user_counts
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: OK }
    post:
      tags: [Groups]
      summary: Crea gruppo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreateRequest' }
            example:
              nome: Supporto N1
              descrizione: Team helpdesk di primo livello
      responses:
        '201': { description: Creato }
  /gruppi/{id}:
    get:
      tags: [Groups]
      summary: Dettaglio gruppo
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    put:
      tags: [Groups]
      summary: Aggiorna gruppo
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdateRequest' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Groups]
      summary: Elimina/Disattiva gruppo
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /gruppi/{id}/add/{userId}:
    post:
      tags: [Groups]
      summary: Aggiunge un utente al gruppo
      parameters:
        - { $ref: '#/components/parameters/pId' }
        - { $ref: '#/components/parameters/pUserId' }
      responses:
        '201': { description: Creato }
  /gruppi/{id}/remove/{userId}:
    delete:
      tags: [Groups]
      summary: Rimuove un utente dal gruppo
      parameters:
        - { $ref: '#/components/parameters/pId' }
        - { $ref: '#/components/parameters/pUserId' }
      responses:
        '200': { description: OK }

  /clienti:
    get:
      tags: [Clients]
      summary: Lista clienti
      responses:
        '200': { description: OK }
    post:
      tags: [Clients]
      summary: Crea cliente (dedup su hub)
      description: |
        In creazione, se presenti `partita_iva` o `codice_fiscale`, esegue lookup sull'hub
        (`hub_catalogo.clienti`) per deduplicare e precompilare i dati. Collega il record locale
        a quello centrale tramite `hub_cliente_id` e, se `TENANT_ID` è configurato, registra la mappatura.
        Se `HUB_CLIENTI_SOFT_DEDUP=1`, in assenza di P.IVA/CF o di match rigido, tenta un match esatto
        su `email`/`telefono`. In caso di più candidati, l'aggancio non viene eseguito automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCreateRequest' }
            example:
              ragione_sociale: Rossi Srl
              partita_iva: IT12345678901
              email: info@rossi.example
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
                  link_hub: { type: boolean }
                  hub_cliente_id: { type: integer }
  /clienti/{id}:
    get:
      tags: [Clients]
      summary: Dettaglio cliente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    put:
      tags: [Clients]
      summary: Aggiorna cliente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientUpdateRequest' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Clients]
      summary: Elimina/Disattiva cliente
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }

  /workflowsteps:
    get:
      tags: [Workflows]
      summary: Lista passi workflow
      responses:
        '200': { description: OK }
    post:
      tags: [Workflows]
      summary: Crea passo workflow
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow_modello_id: { type: integer }
                nome_passo: { type: string }
                descrizione: { type: string }
                responsabile_utente_id: { type: integer, nullable: true }
                responsabile_gruppo_id: { type: integer, nullable: true }
      responses:
        '201': { description: Creato }
  /workflowsteps/{id}:
    put:
      tags: [Workflows]
      summary: Aggiorna passo workflow
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: OK }
    delete:
      tags: [Workflows]
      summary: Elimina passo workflow
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }

  /catalogo_articoli:
    post:
      tags: [Catalog]
      summary: Crea articolo (hub)
      description: Crea un articolo sul DB hub e genera SKU globale sequenziale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titolo: { type: string }
                tipologia: { type: string, enum: [FISICO, SERVIZIO] }
                visibilita: { type: string, enum: [PRIVATO, PUBBLICO] }
                sottotitolo: { type: string }
                descrizione: { type: string }
                marca: { type: string }
                modello: { type: string }
                versione: { type: string }
                codice_tenant: { type: string }
                tenant_id: { type: integer }
              required: [titolo]
            example:
              titolo: Corso Excel Base
              tipologia: SERVIZIO
              visibilita: PUBBLICO
              descrizione: Lezioni base di Excel.
      responses:
        '201': { description: Creato }
  /catalogo_articoli/{id}:
    put:
      tags: [Catalog]
      summary: Aggiorna articolo (hub)
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              titolo: Corso Excel Intermedio
      responses:
        '200': { description: OK }
  /catalogo_varianti:
    post:
      tags: [Catalog]
      summary: Crea variante articolo (hub)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                articolo_id: { type: integer }
                sku: { type: string }
                nome: { type: string }
                stato: { type: string, enum: [ATTIVO, DISATTIVO] }
              required: [articolo_id, sku, nome]
            example:
              articolo_id: 10
              sku: VAR-001
              nome: Pacchetto 10 ore
              stato: ATTIVO
      responses:
        '201': { description: Creato }
  /catalogo_varianti/{id}:
    put:
      tags: [Catalog]
      summary: Aggiorna variante
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
            example:
              nome: Pacchetto 5 ore
      responses:
        '200': { description: OK }
    delete:
      tags: [Catalog]
      summary: Elimina variante
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /catalogo_prezzi:
    get:
      tags: [Catalog]
      summary: Prezzo variante
      parameters:
        - name: variante_id
          in: query
          required: true
          schema: { type: integer }
        - name: listino_codice
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    put:
      tags: [Catalog]
      summary: Imposta prezzo su listino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variante_id: { type: integer }
                prezzo: { type: number, format: float }
                prezzo_confronto: { type: number, format: float }
                quantita_minima: { type: number, format: float }
                listino_codice: { type: string }
                valuta: { type: string }
                listino_nome: { type: string }
              required: [variante_id, prezzo]
            example:
              variante_id: 21
              prezzo: 99.9
              listino_codice: DEFAULT
              valuta: EUR
      responses:
        '200': { description: OK }
  /catalogo_articoli_categorie/{articoloId}:
    put:
      tags: [Catalog]
      summary: Imposta le categorie per un articolo
      parameters:
        - name: articoloId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categorie_slugs:
                  type: array
                  items: { type: string }
              required: [categorie_slugs]
            example:
              categorie_slugs: ["software", "formazione"]
      responses:
        '200': { description: OK }
  /catalogo_relazioni:
    post:
      tags: [Catalog]
      summary: Crea relazione articoli
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                articolo_sorgente_id: { type: integer }
                articolo_correlato_id: { type: integer }
                tipo_relazione: { type: string, enum: [UPSELL, CROSSSELL, ACCESSORIO] }
                priorita: { type: integer }
              required: [articolo_sorgente_id, articolo_correlato_id]
            example:
              articolo_sorgente_id: 10
              articolo_correlato_id: 12
              tipo_relazione: UPSELL
      responses:
        '201': { description: Creato }
  /catalogo_relazioni/{id}:
    put:
      tags: [Catalog]
      summary: Aggiorna relazione
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      tags: [Catalog]
      summary: Elimina relazione
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /catalogo_listini:
    get:
      tags: [Catalog]
      summary: Elenco listini per tenant
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      tags: [Catalog]
      summary: Crea listino
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              tenant_id: 1
              codice: DEFAULT
              nome: Listino base
              valuta: EUR
      responses:
        '201': { description: Creato }
  /catalogo_listini/{id}:
    get:
      tags: [Catalog]
      summary: Dettaglio listino
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    put:
      tags: [Catalog]
      summary: Aggiorna listino
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      tags: [Catalog]
      summary: Elimina listino
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /catalogo_categorie:
    get:
      tags: [Catalog]
      summary: Elenco categorie
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK }
    post:
      tags: [Catalog]
      summary: Crea categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              nome: Informatica
              slug: informatica
      responses:
        '201': { description: Creato }
  /catalogo_categorie/{id}:
    get:
      tags: [Catalog]
      summary: Dettaglio categoria
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    put:
      tags: [Catalog]
      summary: Aggiorna categoria
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      tags: [Catalog]
      summary: Elimina categoria
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }

  /catalog_media:
    post:
      tags: [Media]
      summary: Collega media esistente ad articolo
      description: Azione default `attach`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                articolo_id: { type: integer }
                url: { type: string }
                tipologia: { type: string, enum: [IMMAGINE, DOCUMENTO, VIDEO] }
                testo_alternativo: { type: string }
              required: [articolo_id, url]
            example:
              articolo_id: 10
              url: https://example.com/img.jpg
              tipologia: IMMAGINE
              testo_alternativo: Foto prodotto
      responses:
        '201': { description: Creato }
  /catalog_media/upload:
    post:
      tags: [Media]
      summary: Carica file e collega ad articolo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                articolo_id: { type: integer }
                file: { type: string, format: binary }
                testo_alternativo: { type: string }
                tipologia: { type: string }
              required: [articolo_id, file]
      responses:
        '201': { description: Creato }
  /catalog_media/reorder:
    post:
      tags: [Media]
      summary: Riordina media di un articolo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                articolo_id: { type: integer }
                ordered_ids:
                  type: array
                  items: { type: integer }
              required: [articolo_id, ordered_ids]
      responses:
        '200': { description: OK }
  /catalog_media/{id}/move:
    post:
      tags: [Media]
      summary: Sposta media su/giù
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                articolo_id: { type: integer }
                to: { type: string, enum: [up, down] }
              required: [articolo_id, to]
      responses:
        '200': { description: OK }
  /catalog_media/{id}/cover:
    post:
      tags: [Media]
      summary: Imposta media come copertina (posizione 1)
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
  /catalog_media/{id}:
    put:
      tags: [Media]
      summary: Aggiorna media
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
    delete:
      tags: [Media]
      summary: Rimuove media
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }

  /audit_roles:
    get:
      tags: [Audit]
      summary: Audit cambi ruolo
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: OK }
  /auth_audit:
    get:
      tags: [Audit]
      summary: Audit autenticazione
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: OK }
  /service_logs:
    get:
      tags: [Audit]
      summary: Log servizi integrazione
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }

  /services/{name}:
    post:
      tags: [Services]
      summary: Invio a servizio esterno
      description: name ∈ {whatsapp, email, order, document, payment, ticket, chat}
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              whatsapp:
                value:
                  to: "+39333111222"
                  message: "Ciao!"
              email:
                value:
                  to: user@example.com
                  subject: Benvenuto
                  body: Ciao e benvenuto!
              payment:
                value:
                  gateway: stripe
                  amount: 19.9
      responses:
        '200': { description: OK }
  /services/status:
    get:
      tags: [Services]
      summary: Stato provider configurati
      responses:
        '200': { description: OK }
  /services/retry:
    post:
      tags: [Services]
      summary: Retry singolo log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
              required: [id]
      responses:
        '200': { description: OK }
  /services/retry_failed:
    post:
      tags: [Services]
      summary: Retry multiplo log falliti
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 50 }
                since_hours: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }

  /enrichment/media:
    get:
      tags: [Enrichment]
      summary: Suggerimenti media (immagini) da provider pubblici
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: lang
          in: query
          schema: { type: string }
        - name: providers
          in: query
          description: CSV tra wikimedia, unsplash, pexels
          schema: { type: string }
        - name: prefer
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK }

  /hub_tenants:
    get:
      tags: [Hub]
      summary: Lista tenants (hub)
      responses:
        '200': { description: OK }
    post:
      tags: [Hub]
      summary: Crea tenant su Hub (solo Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ragione_sociale: { type: string }
                slug: { type: string }
                stato: { type: string, enum: [ATTIVO, SOSPESO, IN_ONBOARDING] }
              required: [ragione_sociale, slug]
      responses:
        '201': { description: Creato }
  /hub_tenants/{id}:
    get:
      tags: [Hub]
      summary: Dettaglio tenant (hub)
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      responses:
        '200': { description: OK }
    put:
      tags: [Hub]
      summary: Aggiorna tenant su Hub (solo Admin)
      parameters: [ { $ref: '#/components/parameters/pId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ragione_sociale: { type: string }
                slug: { type: string }
                stato: { type: string, enum: [ATTIVO, SOSPESO, IN_ONBOARDING] }
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    pId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    pUserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    pStato:
      name: stato
      in: query
      schema: { type: string, enum: [APERTO, IN_LAVORAZIONE, CHIUSO, ANNULLATO] }
    pPriorita:
      name: priorita
      in: query
      schema: { type: string, enum: [BASSA, MEDIA, ALTA] }
    pAssegnatoA:
      name: assegnato_a
      in: query
      schema: { type: integer }
    pCreatoDa:
      name: creato_da
      in: query
      schema: { type: integer }
    pClienteId:
      name: cliente_id
      in: query
      schema: { type: integer }
    pSearch:
      name: search
      in: query
      schema: { type: string }
    pMine:
      name: mine
      in: query
      schema: { type: boolean }
    pTeam:
      name: team
      in: query
      schema: { type: boolean }
    pChiusoDal:
      name: chiuso_dal
      in: query
      schema: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Non autenticato
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    AuthLoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
    AuthLoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }
        user: { $ref: '#/components/schemas/UserPublic' }
    UserPublic:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        nome: { type: string }
        cognome: { type: string }
        ruolo: { type: string, enum: [ADMIN, SUPERVISOR, USER, OPERATORE] }
    UserCreateRequest:
      type: object
      properties:
        nome: { type: string }
        cognome: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        ruolo: { type: string, enum: [ADMIN, SUPERVISOR, USER] }
      required: [nome, cognome, email]
    UserUpdateRequest:
      type: object
      properties:
        nome: { type: string }
        cognome: { type: string }
        email: { type: string, format: email }
        password: { type: string }
        ruolo: { type: string, enum: [ADMIN, SUPERVISOR, USER] }
    Ticket:
      type: object
      properties:
        id: { type: integer }
        titolo: { type: string }
        descrizione: { type: string }
        priorita: { type: string, enum: [BASSA, MEDIA, ALTA] }
        stato: { type: string, enum: [APERTO, IN_LAVORAZIONE, CHIUSO] }
        creato_da: { type: integer }
        assegnato_a: { type: integer, nullable: true }
        cliente_id: { type: integer, nullable: true }
        categoria: { type: string, nullable: true }
        creato_il: { type: string, format: date-time }
        aggiornato_il: { type: string, format: date-time }
        chiuso_il: { type: string, format: date-time, nullable: true }
        creato_da_nome: { type: string, nullable: true }
        assegnato_a_nome: { type: string, nullable: true }
        cliente_nome: { type: string, nullable: true }
    TicketCreateRequest:
      type: object
      properties:
        titolo: { type: string }
        descrizione: { type: string }
        priorita: { type: string, enum: [BASSA, MEDIA, ALTA] }
        cliente_id: { type: integer }
        categoria: { type: string }
      required: [titolo]
    TicketUpdateRequest:
      type: object
      properties:
        titolo: { type: string }
        descrizione: { type: string }
        priorita: { type: string, enum: [BASSA, MEDIA, ALTA] }
        cliente_id: { type: integer }
        categoria: { type: string }
    TicketComment:
      type: object
      properties:
        id: { type: integer }
        ticket_id: { type: integer }
        utente_id: { type: integer }
        messaggio: { type: string }
        creato_il: { type: string, format: date-time }
        utente_nome: { type: string, nullable: true }
    TicketAttachment:
      type: object
      properties:
        id: { type: integer }
        commento_id: { type: integer }
        nome_file_originale: { type: string }
        percorso_file: { type: string }
        creato_il: { type: string, format: date-time }
    GroupCreateRequest:
      type: object
      properties:
        nome: { type: string }
        descrizione: { type: string }
      required: [nome]
    GroupUpdateRequest:
      type: object
      properties:
        nome: { type: string }
        descrizione: { type: string }
        attivo: { type: boolean }
    ClientCreateRequest:
      type: object
      properties:
        ragione_sociale: { type: string }
        partita_iva: { type: string }
        codice_fiscale: { type: string }
        indirizzo: { type: string }
        cap: { type: string }
        citta: { type: string }
        provincia: { type: string }
        nazione: { type: string }
        email: { type: string }
        telefono: { type: string }
        tipo_cliente: { type: string, enum: [AZIENDA, PRIVATO, PA] }
        note: { type: string }
      required: [ragione_sociale]
    ClientUpdateRequest:
      type: object
      properties:
        ragione_sociale: { type: string }
        partita_iva: { type: string }
        codice_fiscale: { type: string }
        indirizzo: { type: string }
        cap: { type: string }
        citta: { type: string }
        provincia: { type: string }
        nazione: { type: string }
        latitudine: { type: number, format: float }
        longitudine: { type: number, format: float }
        email: { type: string }
        telefono: { type: string }
        tipo_cliente: { type: string, enum: [AZIENDA, PRIVATO, PA] }
        note: { type: string }

