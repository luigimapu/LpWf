name: Deploy

on:
    push:
        branches: [main, staging]
    workflow_dispatch:
        inputs:
            target:
                description: 'Ambiente di deploy'
                required: true
                type: choice
                default: staging
                options:
                    - staging
                    - production

jobs:
    # Evita run sovrapposti per la stessa branch/ambiente
    # (richiede required status checks per garantire ordine)
    # Concurrency è definita a livello di job via il nome della branch
    # e del workflow stesso.
    verify:
        runs-on: ubuntu-latest
        concurrency:
            group: verify-${{ github.workflow }}-${{ github.ref_name }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v4
            - name: PHP syntax check
              run: |
                  find . -type f -name "*.php" \
                    -not -path "./vendor/*" \
                    -print0 | xargs -0 -n1 -P4 php -l
            - uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: 'npm'
            - name: Install deps
              run: npm ci
            - name: ESLint
              run: npm run lint
            - name: Prettier check
              run: npm run format
            - name: Validate OpenAPI (docs/openapi.yaml)
              run: |
                  set -e
                  if [ -f docs/openapi.yaml ]; then
                    echo "Linting OpenAPI with Redocly CLI (npx)…"
                    npx --yes @redocly/cli@1.19.0 lint docs/openapi.yaml || true
                    echo "Validating with swagger-cli…"
                    npx --yes swagger-cli@4.0.4 validate docs/openapi.yaml
                  else
                    echo "No docs/openapi.yaml found, skipping."
                  fi
            - name: Check docs artifacts exist
              run: |
                  test -f docs/api.html || (echo "docs/api.html mancante" && exit 1)
                  test -f docs/API_REFERENCE.md || (echo "docs/API_REFERENCE.md mancante" && exit 1)
                  echo "Docs artifacts presenti."

    deploy:
        needs: verify
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-${{ github.workflow }}-${{ github.ref_name }}
            cancel-in-progress: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate required secrets
              run: |
                  missing=()
                  require() { [ -n "$1" ] || missing+=("$2"); }

                  # Almeno uno tra SSH_KEY_B64 o SSH_KEY
                  if [ -z "${{ secrets.SSH_KEY_B64 }}" ] && [ -z "${{ secrets.SSH_KEY }}" ]; then
                    missing+=("SSH_KEY_B64 or SSH_KEY")
                  fi

                  require "${{ secrets.SSH_USER }}" "SSH_USER"
                  require "${{ secrets.SSH_PORT }}" "SSH_PORT"
                  require "${{ secrets.SSH_HOST_STAGING }}" "SSH_HOST_STAGING"
                  require "${{ secrets.SSH_HOST_PROD }}" "SSH_HOST_PROD"
                  require "${{ secrets.DEPLOY_PATH_STAGING }}" "DEPLOY_PATH_STAGING"
                  require "${{ secrets.DEPLOY_PATH_PROD }}" "DEPLOY_PATH_PROD"
                  require "${{ secrets.PHP_BIN }}" "PHP_BIN"

                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "ERROR: Missing required secrets:" >&2
                    for k in "${missing[@]}"; do echo " - $k" >&2; done
                    exit 1
                  else
                    echo "All required secrets are present."
                  fi

            - name: Set target based on branch
              run: |
                  # Se avviato manualmente, usa l'input; altrimenti deduci dalla branch
                  if [ -n "${{ github.event.inputs.target }}" ]; then
                    TARGET_INPUT="${{ github.event.inputs.target }}"
                    if [ "$TARGET_INPUT" = "staging" ]; then BRANCH="staging"; else BRANCH="main"; fi
                  else
                    BRANCH="${GITHUB_REF##*/}"
                  fi
                  if [ "$BRANCH" = "staging" ]; then
                    echo "TARGET_HOST=${{ secrets.SSH_HOST_STAGING }}" >> $GITHUB_ENV
                    echo "TARGET_PATH=${{ secrets.DEPLOY_PATH_STAGING }}" >> $GITHUB_ENV
                  else
                    echo "TARGET_HOST=${{ secrets.SSH_HOST_PROD }}" >> $GITHUB_ENV
                    echo "TARGET_PATH=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
                  fi

            - name: Prepare SSH key (SSH_KEY_B64 or SSH_KEY)
              run: |
                  mkdir -p ~/.ssh
                  if [ -n "${{ secrets.SSH_KEY_B64 }}" ]; then
                    echo "Using SSH_KEY_B64"
                    echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
                  elif [ -n "${{ secrets.SSH_KEY }}" ]; then
                    echo "Using SSH_KEY"
                    printf '%s' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
                  else
                    echo "ERROR: Provide either SSH_KEY_B64 or SSH_KEY in repo Secrets" >&2
                    exit 1
                  fi
                  chmod 600 ~/.ssh/deploy_key
                  eval "$(ssh-agent -s)"
                  ssh-add ~/.ssh/deploy_key
                  ssh-add -l || true
                  echo "SSH_IDENTITY=$HOME/.ssh/deploy_key" >> $GITHUB_ENV

            - name: Configure known_hosts (provided or auto-scan)
              run: |
                  mkdir -p ~/.ssh
                  if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
                    echo "Using provided SSH_KNOWN_HOSTS"
                    printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
                    echo "SSH_OPTS=-p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" >> $GITHUB_ENV
                  else
                    HOST="${TARGET_HOST}"
                    PORT="${{ secrets.SSH_PORT }}"
                    echo "Auto-generating known_hosts via ssh-keyscan for ${HOST}:${PORT}"
                    if [ "$PORT" = "22" ]; then
                      ssh-keyscan -t ecdsa,ed25519,rsa -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
                    else
                      ssh-keyscan -t ecdsa,ed25519,rsa -p "$PORT" "$HOST" 2>/dev/null | sed -e "s/^$HOST/[${HOST}]:$PORT/" >> ~/.ssh/known_hosts || true
                    fi
                    if [ -s ~/.ssh/known_hosts ]; then
                      echo "known_hosts populated. Enforcing StrictHostKeyChecking=yes"
                      echo "SSH_OPTS=-p $PORT -o StrictHostKeyChecking=yes" >> $GITHUB_ENV
                    else
                      echo "WARNING: ssh-keyscan failed; falling back to accept-new" >&2
                      echo "SSH_OPTS=-p $PORT -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
                    fi
                  fi

            - name: SSH handshake test
              run: |
                  echo "Testing SSH to ${TARGET_HOST}:${{ secrets.SSH_PORT }} as ${{ secrets.SSH_USER }}"
                  ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 "${{ secrets.SSH_USER }}@${TARGET_HOST}" exit

            - name: Show deploy variables
              run: |
                  echo "TARGET_HOST=$TARGET_HOST"
                  echo "TARGET_PATH=$TARGET_PATH"
                  echo "SSH_OPTS=$SSH_OPTS"

            - name: Ensure remote target path exists and writable
              run: |
                  ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes "${{ secrets.SSH_USER }}@${TARGET_HOST}" \
                    "set -e; mkdir -p '$TARGET_PATH'; ls -ld '$TARGET_PATH'; touch '$TARGET_PATH/.deploy_write_test' && rm -f '$TARGET_PATH/.deploy_write_test' && echo 'Write test OK'"

            - name: Rsync files to server (verbose)
              run: |
                  RSYNC_RSH="ssh $SSH_OPTS -i \"$SSH_IDENTITY\" -o IdentitiesOnly=yes"
                  echo "Using RSYNC_RSH: $RSYNC_RSH"
                  # Use rltz (no owner/group preservation), verbose and progress info
                  rsync -rltzvv --delete \
                    --exclude ".git/" \
                    --exclude ".github/" \
                    --exclude ".env" \
                    --exclude ".env.*" \
                    --exclude "node_modules/" \
                    --exclude ".phpunit.cache/" \
                    --exclude "out/" \
                    -e "$RSYNC_RSH" ./ "${{ secrets.SSH_USER }}@${TARGET_HOST}:${TARGET_PATH}/"

            - name: Verify files on remote
              run: |
                  ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes "${{ secrets.SSH_USER }}@${TARGET_HOST}" \
                    "set -e; echo 'Remote path content:'; ls -la '$TARGET_PATH' | sed -n '1,120p'; echo 'Count of PHP files:'; find '$TARGET_PATH' -maxdepth 2 -name '*.php' | wc -l"

            - name: Check remote .env (DB vars)
              run: |
                  set -e
                  REQ_VARS=(HUB_DB_HOST HUB_DB_NAME HUB_DB_USER HUB_DB_PASS)
                  MISSING=0
                  if ! ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes "${{ secrets.SSH_USER }}@${TARGET_HOST}" "test -f '$TARGET_PATH/.env'"; then
                    echo ".env not found on remote path: $TARGET_PATH" >&2
                    echo "RUN_DB_SETUP=false" >> $GITHUB_ENV
                  else
                    for v in "${REQ_VARS[@]}"; do
                      if ! ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes "${{ secrets.SSH_USER }}@${TARGET_HOST}" "grep -q '^${v}=' '$TARGET_PATH/.env'"; then
                        echo "Missing $v in remote .env" >&2
                        MISSING=$((MISSING+1))
                      fi
                    done
                    if [ "$MISSING" -eq 0 ]; then
                      echo "RUN_DB_SETUP=true" >> $GITHUB_ENV
                    else
                      echo "RUN_DB_SETUP=false" >> $GITHUB_ENV
                    fi
                  fi

            - name: Post-deploy scripts (DB setup)
              if: env.RUN_DB_SETUP == 'true'
              run: |
                  ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes "${{ secrets.SSH_USER }}@${TARGET_HOST}" \
                    "${{ secrets.PHP_BIN }} ${TARGET_PATH}/tools/setup_hub_db.php && \
                     ${{ secrets.PHP_BIN }} ${TARGET_PATH}/tools/setup_tenant_db.php"

            - name: DB setup skipped (no .env or vars)
              if: env.RUN_DB_SETUP != 'true'
              run: |
                  echo "Skipping DB setup: remote .env missing or incomplete (HUB_DB_*)." >&2
