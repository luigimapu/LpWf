name: Deploy

on:
    workflow_dispatch:
        inputs:
            target:
                description: 'Ambiente di deploy'
                required: true
                type: choice
                default: staging
                options:
                    - staging
                    - production

jobs:
    # Evita run sovrapposti per la stessa branch/ambiente
    # (richiede required status checks per garantire ordine)
    # Concurrency è definita a livello di job via il nome della branch
    # e del workflow stesso.
    deploy:
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-${{ github.workflow }}-${{ github.ref_name }}
            cancel-in-progress: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate required secrets
              run: |
                  missing=()
                  require() { [ -n "$1" ] || missing+=("$2"); }

                  # Almeno uno tra SSH_KEY_B64 o SSH_KEY
                  if [ -z "${{ secrets.SSH_KEY_B64 }}" ] && [ -z "${{ secrets.SSH_KEY }}" ]; then
                    missing+=("SSH_KEY_B64 or SSH_KEY")
                  fi

                  require "${{ secrets.SSH_USER }}" "SSH_USER"
                  require "${{ secrets.SSH_PORT }}" "SSH_PORT"
                  require "${{ secrets.SSH_HOST_STAGING }}" "SSH_HOST_STAGING"
                  require "${{ secrets.SSH_HOST_PROD }}" "SSH_HOST_PROD"
                  require "${{ secrets.DEPLOY_PATH_STAGING }}" "DEPLOY_PATH_STAGING"
                  require "${{ secrets.DEPLOY_PATH_PROD }}" "DEPLOY_PATH_PROD"
                  require "${{ secrets.PHP_BIN }}" "PHP_BIN"

                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "ERROR: Missing required secrets:" >&2
                    for k in "${missing[@]}"; do echo " - $k" >&2; done
                    exit 1
                  else
                    echo "All required secrets are present."
                  fi

            - name: Set target based on branch
              run: |
                  # Se avviato manualmente, usa l'input; altrimenti deduci dalla branch
                  if [ -n "${{ github.event.inputs.target }}" ]; then
                    TARGET_INPUT="${{ github.event.inputs.target }}"
                    if [ "$TARGET_INPUT" = "staging" ]; then BRANCH="staging"; else BRANCH="main"; fi
                  else
                    BRANCH="${GITHUB_REF##*/}"
                  fi
                  if [ "$BRANCH" = "staging" ]; then
                    echo "TARGET_HOST=${{ secrets.SSH_HOST_STAGING }}" >> $GITHUB_ENV
                    echo "TARGET_PATH=${{ secrets.DEPLOY_PATH_STAGING }}" >> $GITHUB_ENV
                  else
                    echo "TARGET_HOST=${{ secrets.SSH_HOST_PROD }}" >> $GITHUB_ENV
                    echo "TARGET_PATH=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
                  fi

            - name: Prepare SSH key (SSH_KEY_B64 or SSH_KEY)
              run: |
                  mkdir -p ~/.ssh
                  if [ -n "${{ secrets.SSH_KEY_B64 }}" ]; then
                    echo "Using SSH_KEY_B64"
                    echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
                  elif [ -n "${{ secrets.SSH_KEY }}" ]; then
                    echo "Using SSH_KEY"
                    printf '%s' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
                  else
                    echo "ERROR: Provide either SSH_KEY_B64 or SSH_KEY in repo Secrets" >&2
                    exit 1
                  fi
                  chmod 600 ~/.ssh/deploy_key
                  eval "$(ssh-agent -s)"
                  ssh-add ~/.ssh/deploy_key
                  ssh-add -l || true
                  echo "SSH_IDENTITY=$HOME/.ssh/deploy_key" >> $GITHUB_ENV

            - name: Configure known_hosts (provided or auto-scan)
              run: |
                  mkdir -p ~/.ssh
                  if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
                    echo "Using provided SSH_KNOWN_HOSTS"
                    printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
                    echo "SSH_OPTS=-p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" >> $GITHUB_ENV
                  else
                    HOST="${TARGET_HOST}"
                    PORT="${{ secrets.SSH_PORT }}"
                    echo "Auto-generating known_hosts via ssh-keyscan for ${HOST}:${PORT}"
                    if [ "$PORT" = "22" ]; then
                      ssh-keyscan -t ecdsa,ed25519,rsa -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
                    else
                      ssh-keyscan -t ecdsa,ed25519,rsa -p "$PORT" "$HOST" 2>/dev/null | sed -e "s/^$HOST/[${HOST}]:$PORT/" >> ~/.ssh/known_hosts || true
                    fi
                    if [ -s ~/.ssh/known_hosts ]; then
                      echo "known_hosts populated. Enforcing StrictHostKeyChecking=yes"
                      echo "SSH_OPTS=-p $PORT -o StrictHostKeyChecking=yes" >> $GITHUB_ENV
                    else
                      echo "WARNING: ssh-keyscan failed; falling back to accept-new" >&2
                      echo "SSH_OPTS=-p $PORT -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
                    fi
                  fi

            - name: SSH handshake test
              run: |
                  echo "Testing SSH to ${TARGET_HOST}:${{ secrets.SSH_PORT }} as ${{ secrets.SSH_USER }}"
                  ssh $SSH_OPTS -i "$SSH_IDENTITY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 "${{ secrets.SSH_USER }}@${TARGET_HOST}" exit

            - name: Rsync files to server
              run: |
                  RSYNC_RSH="ssh $SSH_OPTS -i \"$SSH_IDENTITY\" -o IdentitiesOnly=yes"
                  rsync -az --delete \
                    --exclude ".git/" \
                    --exclude ".github/" \
                    --exclude "node_modules/" \
                    --exclude ".phpunit.cache/" \
                    --exclude "out/" \
                    -e "$RSYNC_RSH" ./ "${{ secrets.SSH_USER }}@${TARGET_HOST}:${TARGET_PATH}/"

            - name: Post-deploy scripts (DB setup)
              run: |
                  ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${TARGET_HOST}" \
                    "${{ secrets.PHP_BIN }} ${TARGET_PATH}/tools/setup_hub_db.php && \
                     ${{ secrets.PHP_BIN }} ${TARGET_PATH}/tools/setup_tenant_db.php"
