<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>API Test Client</title>
    
    <!-- 1. Aggiunto il CSS per la libreria Tom-Select -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    
    <style>
        body {
            font-family: sans-serif;
            padding: 1em;
            background-color: #f4f4f4;
        }
        h2 {
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
            color: #333;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 2em;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 150px; /* Aumentato per migliore allineamento */
            font-weight: bold;
        }
        input[type="text"], input[type="number"], input[type="datetime-local"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
        }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .full-width { grid-column: 1 / -1; }
        #parametri-container > div { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee; display: contents; }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Stili specifici per la combobox Tom-Select */
        .ts-control {
             width: 250px;
             display: inline-block;
             vertical-align: middle;
        }
    </style>
</head>
<body>
<h2>Create New Workflow</h2>
<form id="workflowForm">
    <!--div-- class="form-group">
        <label for="id">ID:</label>
        <input type="number" id="id" name="id" required>
    </div-->
    <div class="form-group">
        <label for="nome_workflow">Nome Workflow:</label>
        <input type="text" id="nome_workflow" name="nome_workflow" required>
    </div>
    <div class="form-group">
        <label for="descrizione">Descrizione:</label>
        <input type="text" id="descrizione" name="descrizione" required>
    </div>
    <div class="form-group">
        <label for="attivo">Attivo:</label>
        <input type="checkbox" id="attivo" name="attivo">
    </div>
    <div class="form-group">
        <label for="data_creazione">Data Creazione:</label>
        <input type="datetime-local" id="data_creazione" name="data_creazione" required>
    </div>
    <button type="submit">Create Workflow</button>
</form>


<h2>Create New Workflow STEP</h2>
<form id="workflowFormStep">
    <div class="form-group">
        <label for="workflow_id">ID Workflow:</label>
        <input type="number" id="workflow_id" name="workflow_id" required>
    </div>
    <div class="form-group">
        <label for="nome_passo">Nome Step:</label>
        <input type="text" id="nome_passo" name="nome_passo" required>
    </div>
    <div class="form-group">
        <label for="descrizione_passo">Descrizione:</label>
        <input type="text" id="descrizione_passo" name="descrizione_passo" required>
    </div>
    <div class="form-group">
        <label for="ordine">Ordine:</label>
        <input type="number" id="ordine" name="ordine" value="1" required>
    </div>
    <div class="form-group">
        <label for="sottopasso">SottoPasso:</label>
        <input type="number" id="sottopasso" name="sottopasso" value="1" required>
    </div>
    <div class="form-group">
        <label for="ruolo_responsabile_id">Ruolo Responsabile:</label>
        <input type="number" id="ruolo_responsabile_id" name="ruolo_responsabile_id" >
    </div>
    <div class="form-group">
        <label for="scadenza_giorni">Scadenza Giorni:</label>
        <input type="number" id="scadenza_giorni" name="scadenza_giorni" >
    </div>
    <label for="azione-select">Azione da Eseguire:</label>
    <select id="azione-select" required>
        <option value="" disabled selected>-- Seleziona un'azione --</option>
    </select>

    <!-- Questo contenitore verrà popolato dinamicamente con i campi dei parametri -->
    <div id="parametri-container" class="full-width"></div>

    <hr class="full-width">
    <button type="submit">Create Workflow STEP</button>
</form>

<h2>Create New Task</h2>
<form id="task">

    <div class="form-group">
        <label for="nome_task">Nome Task:</label>
        <input type="text" id="nome_task" name="nome_task" required>
    </div>
    <div class="form-group">
        <label for="descrizione_task">Descrizione:</label>
        <input type="text" id="descrizione_task" name="descrizione_task" required>
    </div>
    <div class="form-group">
        <label for="id_workflow">id_workflow:</label>
        <input type="number" id="id_workflow" name="id_workflow" >
    </div>
    <!-- 2. Questa è la sezione modificata -->
    <div class="form-group">
        <label for="select-user-task">Utente:</label>
        <!-- L'input numerico è stato sostituito da questo <select> -->
        <select id="select-user-task" name="id_utente_assegnato" placeholder="Digita per cercare un utente..."></select>
    </div>
    <button type="submit">Create Task</button>
</form>

<h2>Create New Utente</h2>
<form id="utente">

    <div class="form-group">
        <label for="nome_utente">Nome Utente:</label>
        <input type="text" id="nome_utente" name="nome_utente" required>
    </div>
    <div class="form-group">
        <label for="cognome_utente">Cognome Utente:</label>
        <input type="text" id="cognome_utente" name="cognome_utente" required>
    </div>
    <div class="form-group">
        <label for="email_utente">Email:</label>
        <input type="text" id="email_utente" name="email_utente" >
    </div>

    <button type="submit">Create Utente</button>
</form>


<!-- Librerie e script -->
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const azioneSelect = document.getElementById('azione-select');
        const parametriContainer = document.getElementById('parametri-container');
        const form = document.getElementById('workflowFormStep');

        let azioniDisponibili = [];

        // 1. Carica le azioni disponibili dall'API
        fetch('https://95.110.227.54/LpWF/api/azioni/leggi.php')
            .then(response => response.json())
            .then(data => {
                azioniDisponibili = data;
                azioniDisponibili.forEach(azione => {
                    const option = document.createElement('option');
                    option.value = azione.id;
                    option.textContent = azione.nome_azione;
                    // Salviamo i parametri richiesti direttamente sull'elemento option per un facile accesso
                    option.dataset.params = azione.parametri_richiesti;
                    azioneSelect.appendChild(option);
                });
            })
            .catch(error => console.error("Errore nel caricamento delle azioni:", error));

        // 2. Ascolta i cambiamenti sulla combobox delle azioni
        azioneSelect.addEventListener('change', (event) => {
            parametriContainer.innerHTML = ''; // Pulisci i parametri vecchi

            const selectedOption = event.target.options[event.target.selectedIndex];
            const parametriRichiesti = JSON.parse(selectedOption.dataset.params || '[]');

            if (parametriRichiesti.length > 0) {
                const title = document.createElement('h4');
                title.textContent = "Parametri Azione";
                title.style.gridColumn = "1 / -1"; // Span full width
                parametriContainer.appendChild(title);
            }

            // Crea dinamicamente i campi di input per i parametri richiesti
            parametriRichiesti.forEach(param => {
                const label = document.createElement('label');
                label.htmlFor = `param_${param}`;
                label.textContent = `${param.replace(/_/g, ' ')}:`; // Rende il nome più leggibile

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `param_${param}`;
                input.name = param; // Il nome è la chiave che useremo nel JSON finale
                input.required = true;

                parametriContainer.appendChild(label);
                parametriContainer.appendChild(input);
            });
        });

        // 3. Gestisci l'invio del form
        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const formData = new FormData(form);
            const payload = {
                workflow_id: parseInt(formData.get('workflow_id')),
                nome_passo: formData.get('nome_passo'),
                descrizione_passo: formData.get('descrizione_passo'),
                ordine: parseInt(formData.get('ordine')),
                sottopasso: parseInt(formData.get('sottopasso')),
                ruolo_responsabile_id: parseInt(formData.get('ruolo_responsabile_id')),
                azione_id: parseInt(azioneSelect.value)
            };

            // Raccogli i parametri dinamici
            const parametri_azione = {};
            const parametriInputs = parametriContainer.querySelectorAll('input');
            parametriInputs.forEach(input => {
                parametri_azione[input.name] = input.value;
            });
            payload.parametri_azione = parametri_azione;
            console.log("Dati inviati:", JSON.stringify(payload, null, 2));

            // Invia i dati all'API che abbiamo già creato
            fetch('https://95.110.227.54/LpWF/api/workflow_step/controlla_ordine.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(response => response.json())
                .then(result => {
                    alert('Risposta dal server: ' + result.message);
                    console.log(result);
                })
                .catch(error => console.error("Errore nel salvataggio del passo:", error));
        });
    });


    document.getElementById('workflowForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = {
           // id: document.getElementById('id').value,
            nome_workflow: document.getElementById('nome_workflow').value,
            descrizione: document.getElementById('descrizione').value,
            attivo: document.getElementById('attivo').checked,
            data_creazione: document.getElementById('data_creazione').value
        };
        fetch('https://95.110.227.54/LpWF/api/workflow/crea.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => console.log('Success:', data))
        .catch(error => console.error('Error:', error));
    });

    document.getElementById('utente').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = {
            nome: document.getElementById('nome_utente').value,
            cognome: document.getElementById('cognome_utente').value,
            email: document.getElementById('email_utente').value
        };
        fetch('https://95.110.227.54/LpWF/api/utente/crea.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        })
            .then(response => response.json())
            .then(data => {
                console.log('Success (User):', data);
                alert('Utente creato con successo! ID: ' + data.id);
            })
            .catch(error => {
                console.error('Error (User):', error);
                alert('Errore durante la creazione dell\'utente.');
            });

    });

    document.getElementById('task').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData3 = {
            nome: document.getElementById('nome_task').value,
            descrizione: document.getElementById('descrizione_task').value,
            id_workflow: document.getElementById('id_workflow').value,
            // 4. Modificato per prendere il valore dal nuovo selettore
            id_utente_assegnato: document.getElementById('select-user-task').value
        };
        fetch('https://95.110.227.54/LpWF/api/task/crea.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData3)
        })
        .then(response => response.json())
        .then(data => console.log('Success:', data))
        .catch(error => console.error('Error:', error));
    });

    // 3. Script di inizializzazione per la nuova combobox degli utenti
    new TomSelect('#select-user-task', {
        valueField: 'id',
        labelField: 'nome_completo',
        searchField: 'nome_completo',
        create: false, // Impedisce all'utente di creare nuove voci
        load: function(query, callback) {
            // L'URL punta al tuo endpoint che legge gli utenti
            const url = 'https://95.110.227.54/LpWF/api/utente/leggi.php?search=' + encodeURIComponent(query);
            fetch(url)
                .then(response => response.json())
                .then(json => {
                    callback(json);
                }).catch(()=>{
                    callback();
                });
        },
        render: {
            loading: function() {
                return '<div class="loading">Caricamento...</div>';
            },
            no_results: function() {
                return '<div class="no-results">Nessun utente trovato.</div>';
            }
        }
    });
</script>
</body>
</html>
